<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Paiement SEPA</title>
  <script>
    window.onload = function () {
      const params = new URLSearchParams(window.location.search);

      const amount = params.get("amount") || "0";
      const desc = params.get("desc") || "";
      const iban = params.get("iban") || "";
      const bic = params.get("bic") || "";
      const merchant = params.get("merchant") || "Commerçant";

      // On affiche directement le fallback (aucune redirection)
      document.body.innerHTML = `
        <h2>Paiement SEPA</h2>
        <p>Commerçant : <strong>${merchant}</strong></p>
        <p>IBAN : <strong>${iban}</strong></p>
        <p>Montant : <strong>${amount}</strong></p>
        <p>Description : <strong>${desc}</strong></p>

        <p style="margin-top:20px;">Scannez ce QR avec votre application bancaire :</p>

        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=BCD%0A001%0A1%0ASCT%0A${bic}%0A${merchant}%0A${iban}%0A${amount}%0A${desc}" />
      `;
    };
  </script>
</head>
<body style="background:#000; color:#FFD700; font-family:Arial; text-align:center; padding-top:40px;">
  <h1>Redirection SEPA…</h1>
</body>
</html>
