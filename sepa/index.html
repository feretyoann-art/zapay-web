<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Paiement SEPA</title>
  <script>
    window.onload = function () {
      const params = new URLSearchParams(window.location.search);

      const amount = params.get("amount") || "0";
      const desc = params.get("desc") || "";
      const iban = params.get("iban") || "";
      const bic = params.get("bic") || "";
      const merchant = params.get("merchant") || "Commerçant";

      document.body.innerHTML = `
        <h2>Paiement SEPA</h2>
        <p>Commerçant : <strong>${merchant}</strong></p>
        <p>IBAN : <strong id="iban">${iban}</strong></p>
        <p>Montant : <strong>${amount}</strong></p>
        <p>Description : <strong>${desc}</strong></p>

        <button onclick="copyIBAN()" 
                style="margin-top:20px; padding:12px 24px; font-size:16px; background:#FFD700; border:none; border-radius:8px;">
          Copier l'IBAN
        </button>

        <p style="margin-top:25px; font-size:14px;">
          Ouvrez votre application bancaire et collez l’IBAN pour effectuer le paiement.
        </p>
      `;
    };

    function copyIBAN() {
      const iban = document.getElementById("iban").innerText;
      navigator.clipboard.writeText(iban);
      alert("IBAN copié !");
    }
  </script>
</head>
<body style="background:#000; color:#FFD700; font-family:Arial; text-align:center; padding-top:40px;">
  <h1>Redirection SEPA…</h1>
</body>
</html>
