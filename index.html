<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zapay Web</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h2>Paiement Zapay</h2>

    <p><b>Montant :</b> <span id="amount"></span> €</p>
    <p><b>Description :</b> <span id="desc"></span></p>
    <p><b>Commerçant :</b> <span id="merchant"></span></p>

    <hr>

    <div class="btn" id="payBtn">
      Payer via votre banque
    </div>

    <div class="fallback">
      Si votre application bancaire ne s’ouvre pas :  
      <br>
      <a id="fallbackLink" href="#" target="_blank">Cliquez ici</a>
    </div>

    <hr>

    <p><b>Statut :</b> <span id="status">En attente de paiement</span></p>

  </div>

  <script src="script.js"></script>
</body>
</html>
