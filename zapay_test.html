<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zapay Web V5 - Paiement</title>

  <style>
    body {
      background: #000;
      color: #FFD700;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      display: inline-block;
      border: 2px solid #FFD700;
      border-radius: 16px;
      padding: 25px 30px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      width: 340px;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .logo {
      width: 80px;
      margin-bottom: 15px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .info {
      font-size: 18px;
      margin: 10px 0;
    }

    .status {
      margin-top: 15px;
      font-size: 16px;
      color: #FFD700;
      opacity: 0.9;
    }

    button {
      margin-top: 18px;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      background: #FFD700;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ffea6e;
    }

    button:active {
      transform: scale(0.97);
    }

    .fallback {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.85;
    }

    .manual {
      margin-top: 20px;
      font-size: 14px;
      text-align: left;
      color: #FFD700;
    }

    .manual h3 {
      margin-bottom: 8px;
      text-align: center;
    }

    .manual p {
      margin: 4px 0;
    }

    .manual strong {
      color: #ffea6e;
    }
  </style>
</head>
<body>

  <div class="card">

    <img class="logo" src="https://raw.githubusercontent.com/feretyoann-art/zapay-web/main/logo.png" alt="Zapay">

    <h1>ZAPAY WEB V5</h1>

    <p class="info">Montant : <strong id="amount">...</strong></p>
    <p class="info">Description : <strong id="desc">...</strong></p>
    <p class="info">Commerçant : <strong id="merchant">...</strong></p>

    <p class="status" id="status">Statut : En attente…</p>

    <!-- Bouton principal -->
    <button onclick="payNow()">Payer maintenant</button>

    <!-- Fallback SEPA -->
    <div class="fallback">
      <p>Si le paiement ne s’ouvre pas :</p>
      <button onclick="openSEPA()">Payer via votre banque</button>
    </div>

    <!-- Bloc paiement manuel SEPA -->
    <div class="manual" id="manualBlock" style="display:none;">
      <h3>Paiement SEPA manuel</h3>
      <p>IBAN : <strong id="ibanText"></strong></p>
      <p>BIC : <strong id="bicText"></strong></p>
      <p>Montant : <strong id="amountText"></strong></p>
      <p>Motif : <strong id="descText"></strong></p>
      <p style="margin-top:8px; text-align:center; font-size:13px;">
        Ouvrez votre application bancaire, choisissez “Virement” et copiez ces informations.
      </p>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const amount = params.get("amount") || "Non spécifié";
    const desc = params.get("desc") || "Non spécifié";
    const merchant = params.get("merchant") || "Zapay";

    document.getElementById("amount").innerText = amount;
    document.getElementById("desc").innerText = desc;
    document.getElementById("merchant").innerText = merchant;

    const iban = "FR7612345678901234567890123";
    const bic = "AGRIFRPP";

    // Remplissage bloc manuel
    document.getElementById("ibanText").innerText = iban;
    document.getElementById("bicText").innerText = bic;
    document.getElementById("amountText").innerText = amount;
    document.getElementById("descText").innerText = desc;

    function payNow() {
      // Ici, on marque le paiement comme "en cours"
      document.getElementById("status").innerText = "Statut : Paiement en cours…";

      // On affiche directement le bloc manuel SEPA
      document.getElementById("manualBlock").style.display = "block";

      // Optionnel : petit message
      alert("Ouvrez votre application bancaire et effectuez le virement avec les informations affichées.");
    }

    function openSEPA() {
      const amountParam = params.get("amount") || "0";
      const descParam = params.get("desc") || "";
      const merchantParam = params.get("merchant") || "Zapay";

      const url =
        `https://feretyoann-art.github.io/zapay-link.github.io/sepa/?amount=${amountParam}&desc=${descParam}&iban=${iban}&bic=${bic}&name=${merchantParam}`;

      window.location.href = url;
    }
  </script>

</body>
</html>
