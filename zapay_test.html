<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zapay Web V6</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #FFD700;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .header {
      padding: 25px 0;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .logo {
      width: 90px;
    }

    .title {
      margin-top: 10px;
      font-size: 26px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    .amount {
      font-size: 30px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .desc {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .qr-box {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
      border: 2px solid #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .status {
      margin-top: 25px;
      font-size: 18px;
      opacity: 0.85;
    }

    .footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="header">
    <img class="logo" src="https://feretyoann-art.github.io/zapay-web/Logo.png">
    <div class="title">ZAPAY</div>
  </div>

  <div class="container">

    <div class="amount" id="amount">0,00 €</div>
    <div class="desc" id="desc">Description</div>

    <div class="qr-box" id="qr-web">
      <!-- QR Web fallback -->
    </div>

    <div class="status" id="status">
      En attente du paiement…
    </div>

  </div>

  <div class="footer">
    Zapay © 2026 — Paiement universel
  </div>

</body>
</html>
